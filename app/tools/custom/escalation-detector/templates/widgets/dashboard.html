<div class="card" style="border-radius: 12px; border: 1px solid var(--border-color);">
    <div class="card-body">
        <h6 class="mb-3"><i class="bi bi-exclamation-triangle me-2" style="color: #ef4444;"></i>Escalation Detector</h6>
        <div class="d-flex align-items-center gap-3 mb-3">
            <div style="width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; color: white; background: linear-gradient(135deg, #ef4444, #dc2626);">
                {{ critical + high }}
            </div>
            <div>
                <div style="font-size: 1.4rem; font-weight: 700;">{{ critical + high }}<span style="font-size: 0.85rem; color: var(--text-muted);"> alerts</span></div>
                <div class="small text-muted">Needs attention</div>
            </div>
        </div>
        <div class="d-flex gap-3 mb-2">
            <div class="d-flex align-items-center gap-1">
                <span style="width: 8px; height: 8px; border-radius: 50%; background: #ef4444; display: inline-block;"></span>
                <small>{{ critical }} critical</small>
            </div>
            <div class="d-flex align-items-center gap-1">
                <span style="width: 8px; height: 8px; border-radius: 50%; background: #f97316; display: inline-block;"></span>
                <small>{{ high }} high</small>
            </div>
        </div>
        <div class="small text-muted">{{ total_scanned }} conversations scanned</div>
    </div>
</div>
