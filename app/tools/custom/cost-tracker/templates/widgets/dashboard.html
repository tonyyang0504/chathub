<div class="card" style="border-radius: 12px; border: 1px solid var(--border-color);">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="mb-0"><i class="bi bi-currency-dollar me-2"></i>AI Cost Tracker</h6>
            <span class="badge text-bg-secondary rounded-pill">{{ month_calls }} calls</span>
        </div>

        <div class="d-flex gap-3 mb-3">
            <div class="flex-fill p-2 text-center" style="border: 1px solid var(--border-color); border-radius: 10px;">
                <div class="small text-muted">Today</div>
                <div class="fw-bold" style="color: #10b981;">${{ "%.4f"|format(today_cost) }}</div>
                <div class="small text-muted">{{ today_calls }} calls</div>
            </div>
            <div class="flex-fill p-2 text-center" style="border: 1px solid var(--border-color); border-radius: 10px;">
                <div class="small text-muted">This Month</div>
                <div class="fw-bold" style="color: #10b981;">${{ "%.4f"|format(month_cost) }}</div>
                <div class="small text-muted">{{ month_calls }} calls</div>
            </div>
        </div>

        {% if top_provider %}
        <div class="p-2" style="border: 1px solid var(--border-color); border-radius: 10px;">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <div class="small text-muted">Top Provider</div>
                    <div class="fw-semibold text-capitalize">{{ top_provider }}</div>
                </div>
                <span class="badge rounded-pill" style="background: linear-gradient(135deg, #10b981, #059669); color: white;">
                    ${{ "%.4f"|format(top_provider_cost) }}
                </span>
            </div>
        </div>
        {% endif %}

        <a href="/tools/cost-tracker/" class="btn btn-sm btn-outline-primary rounded-pill mt-3">View Details</a>
    </div>
</div>
