{% extends "base.html" %}

{% block title %}Platforms - ChatHub{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/tools.css">
<style>
.tool-hero {
    background: linear-gradient(135deg, #06b6d4 0%, #0284c7 100%);
    color: white;
    padding: 3rem 2rem;
    border-radius: 16px;
    margin-bottom: 2rem;
}
.tool-hero h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem; }
.tool-hero p { font-size: 1.1rem; opacity: 0.9; max-width: 600px; }

/* Platform tabs */
.platform-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.5rem; }
.platform-tab {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 500;
    border: 2px solid transparent; cursor: pointer; transition: all 0.2s;
    background: var(--hover-bg); color: var(--text-primary);
}
.platform-tab:hover { transform: scale(1.03); }
.platform-tab.active { color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.2); transform: scale(1.05); }
.platform-tab i { font-size: 1rem; }

/* Platform grid cards */
.platform-card {
    border-radius: 12px; border: 1px solid var(--border-color);
    background: var(--card-bg); transition: all 0.2s; cursor: pointer;
    overflow: hidden;
}
.platform-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.platform-card-header {
    padding: 16px; display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border-color);
}
.platform-card-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; color: white;
}
.platform-card-body { padding: 16px; }
.platform-card-stat { font-size: 0.8rem; color: var(--text-muted); }
.platform-card-stat strong { color: var(--text-primary); font-size: 1rem; }

/* Capability badges */
.cap-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 500;
}
.cap-badge.yes { background: #dcfce7; color: #166534; }
.cap-badge.no { background: #f3f4f6; color: #9ca3af; }

/* Detail view */
.stat-card-sm {
    border-radius: 12px; border: 1px solid var(--border-color);
    background: var(--card-bg); padding: 16px; text-align: center;
}
.stat-card-sm .stat-value { font-size: 1.8rem; font-weight: 700; }
.stat-card-sm .stat-label { font-size: 0.8rem; color: var(--text-muted); }

.detail-card {
    border-radius: 12px; border: 1px solid var(--border-color);
    background: var(--card-bg);
}
.detail-card .card-header {
    border-bottom: 1px solid var(--border-color);
    padding: 12px 16px; font-weight: 600;
}
.detail-card .card-body { padding: 16px; }

.cap-matrix { display: flex; flex-wrap: wrap; gap: 8px; }
.cap-item {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 8px;
    background: var(--hover-bg); font-size: 0.85rem;
}
.cap-item .cap-icon { font-size: 0.9rem; }
.cap-item .cap-icon.yes { color: #22c55e; }
.cap-item .cap-icon.no { color: #d1d5db; }

.conv-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border-color);
}
.conv-item:last-child { border-bottom: none; }

/* Scrollable tables */
.detail-table-scroll {
    max-height: 350px; overflow-y: auto;
}
.detail-table-scroll::-webkit-scrollbar { width: 6px; }
.detail-table-scroll::-webkit-scrollbar-track { background: transparent; }
.detail-table-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }
.detail-table-scroll { scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.2) transparent; }

#searchContacts:focus, #searchGroups:focus {
    border-color: #06b6d4;
    box-shadow: none;
}

/* Contact analyzer styles */
.sentiment-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
.sentiment-positive { background: #dcfce7; color: #166534; }
.sentiment-negative { background: #fee2e2; color: #991b1b; }
.sentiment-neutral { background: #f3f4f6; color: #6b7280; }
.urgency-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
.urgency-high { background: #fee2e2; color: #991b1b; }
.urgency-medium { background: #fef9c3; color: #854d0e; }
.urgency-low { background: #f3f4f6; color: #6b7280; }
.engagement-bar { width: 50px; height: 6px; border-radius: 3px; background: var(--hover-bg); overflow: hidden; }
.engagement-bar .fill { height: 100%; border-radius: 3px; }
.tag-pill { font-size: 0.65rem; padding: 2px 6px; border-radius: 8px; background: var(--hover-bg); color: var(--text-muted); }

/* Contact detail modal */
.contact-detail-header { display: flex; align-items: center; gap: 16px; margin-bottom: 1.5rem; }
.contact-detail-stats { display: flex; gap: 16px; margin-bottom: 1.5rem; }
.contact-detail-stat { text-align: center; flex: 1; padding: 12px; background: var(--hover-bg); border-radius: 10px; }
.contact-detail-stat .val { font-size: 1.4rem; font-weight: 700; }
.contact-detail-stat .lbl { font-size: 0.75rem; color: var(--text-muted); }
.contact-msg-item { padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; }
.contact-msg-item:last-child { border-bottom: none; }
.contact-msg-role { font-size: 0.7rem; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
.contact-msg-role.user { background: #dbeafe; color: #1e40af; }
.contact-msg-role.assistant { background: #dcfce7; color: #166534; }

.content-pagination {
    display: flex; justify-content: center; align-items: center; gap: 8px;
    padding: 12px 16px; border-top: 1px solid var(--border-color);
}
.content-pagination .btn {
    width: 36px; height: 36px; padding: 0;
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
}
.content-pagination .page-info { margin: 0 12px; color: var(--text-muted); font-size: 0.875rem; }
</style>
{% endblock %}

{% block content %}
<div class="tool-hero">
    <div class="row align-items-center">
        <div class="col-lg-8">
            <h1><i class="bi bi-globe2 me-3"></i>Platforms</h1>
            <p>Monitor and manage all your messaging platform integrations</p>
        </div>
        <div class="col-lg-4 text-center d-none d-lg-block">
            <i class="bi bi-hdd-network" style="font-size: 8rem; opacity: 0.3;"></i>
        </div>
    </div>
</div>

<!-- Platform Tabs -->
<div class="platform-tabs" id="platformTabs">
    <div class="platform-tab active" data-platform="all" onclick="switchPlatform('all')">
        <i class="bi bi-grid-3x3-gap"></i> All Platforms
    </div>
</div>

<!-- Content Area -->
<div id="platformContent">
    <div class="text-center py-5"><div class="spinner-border text-secondary"></div></div>
</div>

<!-- Contact Detail Modal -->
<div class="modal fade" id="contactDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content" style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;">
            <div class="modal-header border-bottom" style="border-color: var(--border-color) !important;">
                <h5 class="modal-title"><i class="bi bi-person-lines-fill me-2"></i>Contact Details</h5>
                <button type="button" class="modal-close-btn" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="contactDetailContent">
                <div class="text-center py-4"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const PLATFORMS = {};
    let currentPlatform = 'all';
    let detailCache = {};

    async function loadPlatformStats() {
        try {
            const res = await fetch('/api/analytics/platform-stats');
            const data = await res.json();

            // Build tabs
            const tabsEl = document.getElementById('platformTabs');
            let tabsHtml = `<div class="platform-tab active" data-platform="all" onclick="switchPlatform('all')">
                <i class="bi bi-grid-3x3-gap"></i> All
            </div>`;
            data.platforms.forEach(p => {
                PLATFORMS[p.platform] = p;
                tabsHtml += `<div class="platform-tab" data-platform="${p.platform}" onclick="switchPlatform('${p.platform}')" style="--tab-color: ${p.color};">
                    <i class="bi ${p.icon}"></i> ${p.label}
                </div>`;
            });
            tabsEl.innerHTML = tabsHtml;

            renderAllPlatforms(data.platforms);
        } catch (e) {
            document.getElementById('platformContent').innerHTML = '<p class="text-danger">Error loading platform data</p>';
        }
    }

    function switchPlatform(platform) {
        currentPlatform = platform;

        // Update active tab
        document.querySelectorAll('.platform-tab').forEach(tab => {
            const isActive = tab.dataset.platform === platform;
            tab.classList.toggle('active', isActive);
            if (isActive && platform !== 'all') {
                const p = PLATFORMS[platform];
                if (p) tab.style.background = p.color;
            } else if (isActive && platform === 'all') {
                tab.style.background = '#06b6d4';
                tab.style.color = 'white';
            } else {
                tab.style.background = '';
                tab.style.color = '';
            }
        });

        if (platform === 'all') {
            renderAllPlatforms(Object.values(PLATFORMS));
        } else {
            loadPlatformDetail(platform);
        }
    }

    function renderAllPlatforms(platforms) {
        const content = document.getElementById('platformContent');
        content.innerHTML = '<div class="row g-3">' + platforms.map(p => {
            const status = p.running_bots > 0
                ? `<span class="badge bg-success">${p.running_bots} running</span>`
                : p.bot_count > 0
                    ? `<span class="badge bg-secondary">${p.bot_count} bot${p.bot_count > 1 ? 's' : ''} (stopped)</span>`
                    : `<span class="badge bg-light text-muted">Not set up</span>`;

            return `
            <div class="col-md-6 col-lg-4">
                <div class="platform-card" onclick="switchPlatform('${p.platform}')">
                    <div class="platform-card-header">
                        <div class="platform-card-icon" style="background: ${p.color};">
                            <i class="bi ${p.icon}"></i>
                        </div>
                        <div>
                            <div class="fw-bold">${p.label}</div>
                            ${status}
                        </div>
                    </div>
                    <div class="platform-card-body">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="platform-card-stat"><strong>${p.conversations}</strong> conversations</span>
                            <span class="platform-card-stat"><strong>${p.messages}</strong> messages</span>
                        </div>
                        ${p.bot_count === 0 ? `<a href="/dashboard/guides#${p.platform}" class="btn btn-sm btn-outline-primary rounded-pill mt-2 w-100" onclick="event.stopPropagation();">
                            <i class="bi bi-plus-lg me-1"></i>Set Up
                        </a>` : ''}
                    </div>
                </div>
            </div>`;
        }).join('') + '</div>';
    }

    async function loadPlatformDetail(platform) {
        const content = document.getElementById('platformContent');
        content.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-secondary"></div></div>';

        try {
            const res = await fetch(`/api/analytics/platform-stats/${platform}`);
            const data = await res.json();
            detailCache[platform] = data;

            // Fetch groups using bot IDs for this platform
            const botIds = data.bots.map(b => b.id).join(',');
            if (botIds) {
                const groupsRes = await fetch(`/api/bots/all/groups?bot_ids=${botIds}`);
                const groupsData = await groupsRes.json();
                data._groups = groupsData.groups || [];
                const botMap = {};
                data.bots.forEach(b => botMap[b.id] = b.name);
                data._groups.forEach(g => g.bot_name = botMap[g.bot_id] || '');
            } else {
                data._groups = [];
            }

            renderPlatformDetail(data);
            loadPlatformContacts(platform, 1);
        } catch (e) {
            content.innerHTML = '<p class="text-danger">Error loading platform details</p>';
        }
    }

    function renderPlatformDetail(data) {
        const content = document.getElementById('platformContent');
        const caps = data.capabilities || {};
        const capLabels = {
            groups: 'Groups', media: 'Media', file_send: 'File Send', reactions: 'Reactions',
            read_receipts: 'Read Receipts', typing_indicator: 'Typing', history_sync: 'History Sync',
            contacts_list: 'Contacts', groups_list: 'Groups List', voice_messages: 'Voice'
        };

        content.innerHTML = `
        <!-- Stats Row -->
        <div class="row g-3 mb-4">
            <div class="col-4 col-md-2">
                <div class="stat-card-sm">
                    <div class="stat-value" style="color: ${data.color};">${data.running_bots}/${data.bot_count}</div>
                    <div class="stat-label">Bots Running</div>
                </div>
            </div>
            <div class="col-4 col-md-2">
                <div class="stat-card-sm">
                    <div class="stat-value">${data.total_conversations}</div>
                    <div class="stat-label">Conversations</div>
                </div>
            </div>
            <div class="col-4 col-md-2">
                <div class="stat-card-sm">
                    <div class="stat-value">${data.total_messages}</div>
                    <div class="stat-label">Messages</div>
                </div>
            </div>
            <div class="col-4 col-md-2">
                <div class="stat-card-sm">
                    <div class="stat-value">${data.total_contacts}</div>
                    <div class="stat-label">Contacts</div>
                </div>
            </div>
            <div class="col-4 col-md-2">
                <div class="stat-card-sm">
                    <div class="stat-value">${data.total_groups}</div>
                    <div class="stat-label">Groups</div>
                </div>
            </div>
            <div class="col-4 col-md-2">
                <div class="stat-card-sm">
                    <div class="stat-value">${data.messages_today}</div>
                    <div class="stat-label">Today</div>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <!-- Bots -->
            <div class="col-lg-8">
                <div class="detail-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-robot me-2"></i>Bots on ${data.label}</span>
                        <a href="/dashboard/bots" class="btn btn-sm btn-outline-secondary rounded-pill">Manage</a>
                    </div>
                    <div class="card-body p-0">
                        ${data.bots.length ? `
                        <div class="detail-table-scroll">
                            <table class="table table-hover mb-0">
                                <thead style="position: sticky; top: 0; background: var(--card-bg); z-index: 1;">
                                    <tr>
                                        <th>Name</th>
                                        <th>Account</th>
                                        <th class="text-center">Status</th>
                                        <th class="text-center">Conversations</th>
                                        <th class="text-center">Messages</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.bots.map(b => `
                                    <tr>
                                        <td><strong>${b.name}</strong></td>
                                        <td class="text-muted small">${b.account_name || b.account_phone || '—'}</td>
                                        <td class="text-center">${b.is_running
                                            ? '<span class="badge bg-success">Running</span>'
                                            : '<span class="badge bg-secondary">Stopped</span>'}</td>
                                        <td class="text-center">${b.conversation_count}</td>
                                        <td class="text-center">${b.message_count}</td>
                                    </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>` : `
                        <div class="text-center py-4 text-muted">
                            <i class="bi bi-robot" style="font-size: 2rem; opacity: 0.3;"></i>
                            <p class="mt-2 mb-0">No bots on ${data.label} yet</p>
                        </div>`}
                    </div>
                </div>
            </div>

            <!-- Capabilities -->
            <div class="col-lg-4">
                <div class="detail-card h-100">
                    <div class="card-header"><i class="bi bi-check2-square me-2"></i>Capabilities</div>
                    <div class="card-body">
                        <div class="cap-matrix">
                            ${Object.entries(capLabels).map(([key, label]) => {
                                const has = caps[key];
                                return `<div class="cap-item">
                                    <i class="bi ${has ? 'bi-check-circle-fill' : 'bi-x-circle'} cap-icon ${has ? 'yes' : 'no'}"></i>
                                    ${label}
                                </div>`;
                            }).join('')}
                        </div>
                        <div class="mt-3 pt-3" style="border-top: 1px solid var(--border-color);">
                            <div class="small text-muted mb-1">Auth Method</div>
                            <span class="badge bg-light text-dark">${data.auth_method.replace('_', ' ')}</span>
                            <a href="/dashboard/guides#${data.platform}" class="btn btn-sm btn-outline-secondary rounded-pill ms-2">
                                <i class="bi bi-book me-1"></i>Setup Guide
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Contacts (rich view) -->
            <div class="col-12">
                <div class="detail-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-person-lines-fill me-2"></i>Contacts <span class="badge bg-secondary ms-1" id="contactsTotalBadge">${data.total_contacts}</span></span>
                        <div class="d-flex gap-2">
                            <input type="text" class="form-control form-control-sm rounded-pill" style="width: 160px;" placeholder="Search contacts..." id="searchContacts" onkeyup="searchPlatformContacts()">
                        </div>
                    </div>
                    <div class="card-body p-0" id="richContactsContainer">
                        <div class="text-center py-4"><div class="spinner-border spinner-border-sm text-secondary"></div></div>
                    </div>
                </div>
            </div>

            <!-- Groups -->
            <div class="col-lg-6">
                <div class="detail-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-people me-2"></i>Groups <span class="badge bg-secondary ms-1">${(data._groups || []).length}</span></span>
                        <input type="text" class="form-control form-control-sm rounded-pill" style="width: 140px;" placeholder="Search..." id="searchGroups" onkeyup="filterGroups()">
                    </div>
                    <div class="card-body p-0">
                        ${(data._groups || []).length ? `
                        <div class="detail-table-scroll" id="groupsTableWrap">
                            <table class="table table-hover table-sm mb-0">
                                <thead style="position: sticky; top: 0; background: var(--card-bg); z-index: 1;">
                                    <tr>
                                        <th>Group</th>
                                        <th>Bot</th>
                                        <th class="text-end">Last Active</th>
                                    </tr>
                                </thead>
                                <tbody id="groupsTableBody">
                                    ${(data._groups || []).map(g => `
                                    <tr class="group-row" data-name="${(g.name || g.chat_id || '').toLowerCase()}">
                                        <td>
                                            <div class="d-flex align-items-center gap-2">
                                                ${g.profile_pic
                                                    ? `<img src="${g.profile_pic}" class="rounded-circle" style="width:28px;height:28px;object-fit:cover;">`
                                                    : `<div style="width:28px;height:28px;border-radius:50%;background:${data.color};display:flex;align-items:center;justify-content:center;color:white;font-size:0.7rem;"><i class="bi bi-people-fill"></i></div>`}
                                                <div class="fw-medium" style="font-size:0.85rem;">${g.name || g.chat_id}</div>
                                            </div>
                                        </td>
                                        <td class="text-muted small">${g.bot_name || '—'}</td>
                                        <td class="text-end text-muted small">${g.last_message_at ? new Date(g.last_message_at).toLocaleDateString() : '—'}</td>
                                    </tr>`).join('')}
                                </tbody>
                            </table>
                        </div>` : `
                        <div class="text-center py-4 text-muted">
                            <i class="bi bi-people" style="font-size: 2rem; opacity: 0.3;"></i>
                            <p class="mt-2 mb-0">No groups yet</p>
                        </div>`}
                    </div>
                </div>
            </div>

            <!-- Recent Conversations -->
            <div class="col-12">
                <div class="detail-card">
                    <div class="card-header"><i class="bi bi-chat-dots me-2"></i>Recent Conversations</div>
                    <div class="card-body">
                        ${data.recent_conversations.length ? data.recent_conversations.map(c => `
                        <div class="conv-item">
                            <div>
                                <span>${c.is_group ? '<i class="bi bi-people-fill me-1"></i>' : '<i class="bi bi-person me-1"></i>'}</span>
                                <strong>${c.chat_name}</strong>
                                ${c.bot_name ? `<span class="text-muted small ms-2">${c.bot_name}</span>` : ''}
                            </div>
                            <div>
                                <span class="badge bg-light text-dark me-2">${c.message_count} msgs</span>
                                <span class="text-muted small">${c.last_message_at ? new Date(c.last_message_at).toLocaleDateString() : '—'}</span>
                            </div>
                        </div>`).join('') : '<p class="text-muted text-center mb-0">No conversations yet</p>'}
                    </div>
                </div>
            </div>
        </div>`;
    }

    // Auto-select platform from URL hash
    const hash = window.location.hash.replace('#', '');

    // ============== Rich Contacts ==============
    let contactsSearchTimeout = null;
    const contactDetailModal = new bootstrap.Modal(document.getElementById('contactDetailModal'));

    async function loadPlatformContacts(platform, page = 1) {
        const container = document.getElementById('richContactsContainer');
        if (!container) return;
        const search = document.getElementById('searchContacts')?.value || '';

        try {
            const res = await fetch(`/api/analytics/platform-contacts/${platform}?page=${page}&page_size=15&search=${encodeURIComponent(search)}`);
            const data = await res.json();
            renderRichContacts(data, platform, page);
            const badge = document.getElementById('contactsTotalBadge');
            if (badge) badge.textContent = data.total;
        } catch (e) {
            container.innerHTML = '<div class="text-center py-3 text-danger">Error loading contacts</div>';
        }
    }

    function renderRichContacts(data, platform, page) {
        const container = document.getElementById('richContactsContainer');
        const contacts = data.items || [];

        if (!contacts.length) {
            container.innerHTML = '<div class="text-center py-4 text-muted"><i class="bi bi-person" style="font-size:2rem;opacity:0.3;"></i><p class="mt-2 mb-0">No contacts yet</p></div>';
            return;
        }

        const getSentimentBadge = (s) => {
            if (!s) return '';
            const cls = s === 'positive' ? 'sentiment-positive' : s === 'negative' ? 'sentiment-negative' : 'sentiment-neutral';
            return `<span class="sentiment-badge ${cls}">${s}</span>`;
        };
        const getUrgencyBadge = (u) => {
            if (!u) return '';
            const cls = u === 'high' ? 'urgency-high' : u === 'medium' ? 'urgency-medium' : 'urgency-low';
            return `<span class="urgency-badge ${cls}">${u}</span>`;
        };
        const getEngagementBar = (score) => {
            const pct = Math.round((score || 0) * 100);
            const color = pct >= 70 ? '#22c55e' : pct >= 40 ? '#eab308' : '#ef4444';
            return `<div class="d-flex align-items-center gap-2"><div class="engagement-bar"><div class="fill" style="width:${pct}%;background:${color};"></div></div><small class="text-muted">${pct}%</small></div>`;
        };
        const platformColor = PLATFORMS[platform]?.color || '#666';

        let html = `
        <div class="detail-table-scroll" style="max-height: 500px;">
            <table class="table table-hover table-sm mb-0">
                <thead style="position: sticky; top: 0; background: var(--card-bg); z-index: 1;">
                    <tr>
                        <th>Contact</th>
                        <th>Bot</th>
                        <th>Sentiment</th>
                        <th>Intent</th>
                        <th>Engagement</th>
                        <th>Tags</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${contacts.map(c => `
                    <tr>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                ${c.profile_pic
                                    ? `<img src="${c.profile_pic}" class="rounded-circle" style="width:32px;height:32px;object-fit:cover;">`
                                    : `<div style="width:32px;height:32px;border-radius:50%;background:${platformColor};display:flex;align-items:center;justify-content:center;color:white;font-size:0.75rem;"><i class="bi bi-person"></i></div>`}
                                <div>
                                    <div class="fw-medium" style="font-size:0.85rem;">${c.display_name || c.phone}</div>
                                    ${c.display_name && c.phone !== c.display_name ? `<div class="text-muted" style="font-size:0.7rem;">${c.phone}</div>` : ''}
                                </div>
                            </div>
                        </td>
                        <td class="text-muted small">${c.bot_name || '—'}</td>
                        <td>${getSentimentBadge(c.sentiment)} ${getUrgencyBadge(c.urgency)}</td>
                        <td class="small">${c.predicted_intent || '<span class="text-muted">—</span>'}</td>
                        <td>${getEngagementBar(c.engagement_score)}</td>
                        <td>${c.tags && c.tags.length ? c.tags.slice(0, 3).map(t => `<span class="tag-pill">${t.tag}</span>`).join(' ') + (c.tag_count > 3 ? ` <span class="text-muted small">+${c.tag_count - 3}</span>` : '') : '<span class="text-muted small">—</span>'}</td>
                        <td class="text-center">
                            ${c.id ? `<button class="btn btn-sm btn-outline-primary rounded-pill px-2" onclick="showPlatformContactDetail(${c.id})" title="View Details"><i class="bi bi-eye"></i></button>` : '<span class="text-muted small">No hub</span>'}
                        </td>
                    </tr>`).join('')}
                </tbody>
            </table>
        </div>`;

        // Pagination
        if (data.total_pages > 1) {
            html += `
            <div class="content-pagination">
                <button class="btn btn-sm btn-outline-secondary" onclick="loadPlatformContacts('${platform}', 1)" ${page === 1 ? 'disabled' : ''} title="First"><i class="bi bi-chevron-double-left"></i></button>
                <button class="btn btn-sm btn-outline-secondary" onclick="loadPlatformContacts('${platform}', ${page - 1})" ${page === 1 ? 'disabled' : ''} title="Previous"><i class="bi bi-chevron-left"></i></button>
                <span class="page-info">Page ${page} of ${data.total_pages} (${data.total} contacts)</span>
                <button class="btn btn-sm btn-outline-secondary" onclick="loadPlatformContacts('${platform}', ${page + 1})" ${page === data.total_pages ? 'disabled' : ''} title="Next"><i class="bi bi-chevron-right"></i></button>
                <button class="btn btn-sm btn-outline-secondary" onclick="loadPlatformContacts('${platform}', ${data.total_pages})" ${page === data.total_pages ? 'disabled' : ''} title="Last"><i class="bi bi-chevron-double-right"></i></button>
            </div>`;
        }

        container.innerHTML = html;
    }

    function searchPlatformContacts() {
        clearTimeout(contactsSearchTimeout);
        contactsSearchTimeout = setTimeout(() => {
            if (currentPlatform && currentPlatform !== 'all') {
                loadPlatformContacts(currentPlatform, 1);
            }
        }, 300);
    }

    async function showPlatformContactDetail(contactId) {
        const content = document.getElementById('contactDetailContent');
        content.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div></div>';
        contactDetailModal.show();

        try {
            const [contactRes, messagesRes] = await Promise.all([
                fetch(`/api/hubs/contacts/${contactId}`),
                fetch(`/api/hubs/contacts/${contactId}/messages`)
            ]);

            if (!contactRes.ok) throw new Error('Failed to load contact');
            const contact = await contactRes.json();
            const messagesData = messagesRes.ok ? await messagesRes.json() : { statistics: {}, recent_messages: [] };
            renderPlatformContactDetail(contact, messagesData);
        } catch (e) {
            content.innerHTML = '<div class="alert alert-danger">Failed to load contact details</div>';
        }
    }

    function renderPlatformContactDetail(contact, messagesData) {
        const content = document.getElementById('contactDetailContent');
        const engPct = Math.round((contact.engagement_score || 0) * 100);
        const engColor = engPct >= 70 ? '#22c55e' : engPct >= 40 ? '#eab308' : '#ef4444';
        const stats = messagesData.statistics || {};
        const msgs = messagesData.recent_messages || [];

        const getSentimentBadge = (s) => {
            if (!s) return '<span class="sentiment-badge sentiment-neutral">unknown</span>';
            const cls = s === 'positive' ? 'sentiment-positive' : s === 'negative' ? 'sentiment-negative' : 'sentiment-neutral';
            return `<span class="sentiment-badge ${cls}">${s}</span>`;
        };
        const getUrgencyBadge = (u) => {
            if (!u) return '';
            const cls = u === 'high' ? 'urgency-high' : u === 'medium' ? 'urgency-medium' : 'urgency-low';
            return `<span class="urgency-badge ${cls}">${u}</span>`;
        };

        const platformColor = PLATFORMS[currentPlatform]?.color || '#06b6d4';

        content.innerHTML = `
        <div style="max-height: 70vh; overflow-y: auto; padding-right: 0.5rem;">
            <!-- Header -->
            <div class="contact-detail-header">
                ${contact.profile_pic
                    ? `<img src="${contact.profile_pic}" class="rounded-circle" style="width:56px;height:56px;object-fit:cover;">`
                    : `<div style="width:56px;height:56px;border-radius:50%;background:${platformColor};display:flex;align-items:center;justify-content:center;color:white;font-size:1.3rem;"><i class="bi bi-person"></i></div>`}
                <div>
                    <h5 class="mb-0">${contact.display_name || contact.phone}</h5>
                    <div class="text-muted small">${contact.phone}</div>
                    <div class="mt-1">${getSentimentBadge(contact.sentiment)} ${getUrgencyBadge(contact.urgency)}</div>
                </div>
            </div>

            <!-- Stats -->
            <div class="contact-detail-stats">
                <div class="contact-detail-stat">
                    <div class="val" style="color: ${engColor};">${engPct}%</div>
                    <div class="lbl">Engagement</div>
                </div>
                <div class="contact-detail-stat">
                    <div class="val">${stats.total_messages || 0}</div>
                    <div class="lbl">Messages</div>
                </div>
                <div class="contact-detail-stat">
                    <div class="val">${contact.tags?.length || 0}</div>
                    <div class="lbl">Tags</div>
                </div>
                <div class="contact-detail-stat">
                    <div class="val">${contact.first_seen_at ? new Date(contact.first_seen_at).toLocaleDateString() : '—'}</div>
                    <div class="lbl">First Seen</div>
                </div>
            </div>

            <!-- Engagement bar -->
            <div class="mb-3">
                <label class="form-label fw-semibold small">Engagement Score</label>
                <div class="progress" style="height: 8px; border-radius: 4px;">
                    <div class="progress-bar" style="width: ${engPct}%; background: ${engColor};"></div>
                </div>
            </div>

            ${contact.predicted_intent ? `
            <div class="mb-3">
                <label class="form-label fw-semibold small">Predicted Intent</label>
                <div>${contact.predicted_intent}</div>
            </div>` : ''}

            ${contact.description ? `
            <div class="mb-3">
                <label class="form-label fw-semibold small">AI Summary</label>
                <div class="small" style="background: var(--hover-bg); padding: 10px; border-radius: 8px;">${contact.description}</div>
            </div>` : ''}

            ${contact.follow_up_needed ? `
            <div class="mb-3">
                <label class="form-label fw-semibold small">Follow-up</label>
                <div class="small">${contact.follow_up_reason || 'Follow-up needed'}</div>
            </div>` : ''}

            <!-- Tags -->
            ${contact.tags && contact.tags.length ? `
            <div class="mb-3">
                <label class="form-label fw-semibold small">Tags</label>
                <div class="d-flex flex-wrap gap-1">
                    ${contact.tags.map(t => `<span class="tag-pill">${t.tag}${t.value ? ': ' + t.value : ''}</span>`).join('')}
                </div>
            </div>` : ''}

            <!-- Recent Messages -->
            <div>
                <label class="form-label fw-semibold small">Recent Messages</label>
                ${msgs.length ? msgs.slice(0, 10).map(m => `
                <div class="contact-msg-item">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="contact-msg-role ${m.role || 'user'}">${m.role === 'assistant' ? 'Bot' : 'User'}</span>
                        <span class="text-muted" style="font-size:0.7rem;">${m.timestamp ? new Date(m.timestamp).toLocaleString() : ''}</span>
                    </div>
                    <div class="small">${(m.content || '').substring(0, 200)}${(m.content || '').length > 200 ? '...' : ''}</div>
                </div>`).join('') : '<p class="text-muted small">No messages yet</p>'}
            </div>
        </div>`;
    }

    function filterGroups() {
        const query = (document.getElementById('searchGroups')?.value || '').toLowerCase();
        document.querySelectorAll('.group-row').forEach(row => {
            row.style.display = row.dataset.name.includes(query) ? '' : 'none';
        });
    }

    loadPlatformStats().then(() => {
        if (hash && PLATFORMS[hash]) {
            switchPlatform(hash);
        }
    });
</script>
{% endblock %}
