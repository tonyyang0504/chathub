<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WhatsApp Bot Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Segoe UI', 'Inter', Helvetica Neue, Helvetica, Lucida Grande, Arial, Ubuntu, Cantarell, Fira Sans, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #25D366 0%, #1ebe5d 50%, #25D366 100%);
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .card-body {
            padding: 40px;
        }
        .brand-icon {
            font-size: 3.5rem;
            color: #25D366;
        }
        h2 {
            color: #111b21;
            font-weight: 600;
        }
        .text-muted {
            color: #667781 !important;
        }
        .form-label {
            font-weight: 500;
            color: #111b21;
            font-size: 14px;
        }
        .form-control {
            border: 1px solid #e9edef;
            border-radius: 25px;
            padding: 12px 20px;
            font-size: 15px;
            color: #111b21;
        }
        .form-control:focus {
            border-color: #25D366;
            box-shadow: none;
        }
        .form-control::placeholder {
            color: #8696a0;
        }
        .input-group-text {
            background: #f0f2f5;
            border: 1px solid #e9edef;
            border-right: none;
            border-radius: 25px 0 0 25px;
            color: #667781;
        }
        .input-group .form-control {
            border-left: none;
            border-radius: 0 25px 25px 0;
        }
        .input-group:focus-within .input-group-text {
            border-color: #25D366;
        }
        .btn-success {
            background: #25D366;
            border-color: #25D366;
            border-radius: 25px;
            font-weight: 500;
            padding: 12px;
            font-size: 15px;
        }
        .btn-success:hover {
            background: #1ebe5d;
            border-color: #1ebe5d;
        }
        .alert {
            border-radius: 10px;
            border: none;
            font-size: 14px;
        }
        .alert-danger {
            background: rgba(234, 0, 56, 0.1);
            color: #ea0038;
        }
        a {
            color: #25D366;
            text-decoration: none;
        }
        a:hover {
            color: #1ebe5d;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="card">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="bi bi-whatsapp brand-icon"></i>
                        <h2 class="mt-3 mb-1">WhatsApp Bot</h2>
                        <p class="text-muted">Sign in to your account</p>
                    </div>

                    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100" id="loginBtn">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">Don't have an account?
                            <a href="/auth/register">Register</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errorAlert = document.getElementById('errorAlert');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Signing in...';
            errorAlert.classList.add('d-none');

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = '/dashboard';
                } else {
                    // Handle both string and array error formats from FastAPI
                    let errorMsg = 'Login failed';
                    if (data.detail) {
                        if (typeof data.detail === 'string') {
                            errorMsg = data.detail;
                        } else if (Array.isArray(data.detail)) {
                            errorMsg = data.detail.map(e => e.msg).join(', ');
                        }
                    }
                    errorAlert.textContent = errorMsg;
                    errorAlert.classList.remove('d-none');
                }
            } catch (error) {
                errorAlert.textContent = 'An error occurred. Please try again.';
                errorAlert.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i> Sign In';
            }
        });
    </script>
</body>
</html>
