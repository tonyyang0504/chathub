<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)"/>
  <!-- Robot head -->
  <rect x="25" y="28" width="50" height="40" rx="8" fill="#ffffff"/>
  <!-- Eyes -->
  <circle cx="38" cy="45" r="6" fill="#6366f1"/>
  <circle cx="62" cy="45" r="6" fill="#6366f1"/>
  <!-- Eye highlights -->
  <circle cx="40" cy="43" r="2" fill="#ffffff"/>
  <circle cx="64" cy="43" r="2" fill="#ffffff"/>
  <!-- Mouth/speaker -->
  <rect x="35" y="56" width="30" height="6" rx="3" fill="#6366f1"/>
  <!-- Antenna -->
  <line x1="50" y1="28" x2="50" y2="18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="15" r="5" fill="#22c55e"/>
</svg>