name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pystray pillow

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Create favicon
        run: |
          python create_icon.py

      - name: Update version in spec file
        shell: python
        run: |
          import re
          with open('installer/chathub_setup.iss', 'r') as f:
              content = f.read()
          content = re.sub(
              r'#define MyAppVersion ".*"',
              '#define MyAppVersion "${{ steps.get_version.outputs.VERSION }}"',
              content
          )
          with open('installer/chathub_setup.iss', 'w') as f:
              f.write(content)

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm chathub.spec

      - name: Verify build output
        run: |
          if (Test-Path "dist/ChatHub/ChatHub.exe") {
            Write-Host "Build successful!"
            $size = (Get-Item "dist/ChatHub/ChatHub.exe").Length / 1MB
            Write-Host "Executable size: $([math]::Round($size, 2)) MB"
          } else {
            Write-Host "Build failed - executable not found"
            exit 1
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\chathub_setup.iss

      - name: Create portable ZIP
        run: |
          Compress-Archive -Path "dist\ChatHub\*" -DestinationPath "dist\ChatHub_Portable_${{ steps.get_version.outputs.VERSION }}.zip"

      - name: List build artifacts
        run: |
          Write-Host "=== Build Artifacts ==="
          Get-ChildItem -Path dist -Recurse | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            $size = $_.Length / 1MB
            Write-Host "$($_.Name) - $([math]::Round($size, 2)) MB"
          }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChatHub-Portable
          path: dist/ChatHub_Portable_${{ steps.get_version.outputs.VERSION }}.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ChatHub-Installer
          path: dist/installer/ChatHub_Setup_${{ steps.get_version.outputs.VERSION }}.exe

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download portable ZIP
        uses: actions/download-artifact@v4
        with:
          name: ChatHub-Portable
          path: ./artifacts

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: ChatHub-Installer
          path: ./artifacts

      - name: List artifacts
        run: ls -la ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ChatHub v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/ChatHub_Setup_${{ steps.get_version.outputs.VERSION }}.exe
            ./artifacts/ChatHub_Portable_${{ steps.get_version.outputs.VERSION }}.zip
          body: |
            ## ChatHub v${{ steps.get_version.outputs.VERSION }}

            ### Downloads

            | File | Description |
            |------|-------------|
            | `ChatHub_Setup_${{ steps.get_version.outputs.VERSION }}.exe` | Windows Installer (recommended) |
            | `ChatHub_Portable_${{ steps.get_version.outputs.VERSION }}.zip` | Portable version (no installation) |

            ### Installation

            **Option 1: Installer (Recommended)**
            1. Download `ChatHub_Setup_${{ steps.get_version.outputs.VERSION }}.exe`
            2. Run the installer
            3. Launch ChatHub from Start Menu or Desktop

            **Option 2: Portable**
            1. Download `ChatHub_Portable_${{ steps.get_version.outputs.VERSION }}.zip`
            2. Extract to any folder
            3. Run `ChatHub.exe`

            ### What's New

            See the auto-generated release notes below.
